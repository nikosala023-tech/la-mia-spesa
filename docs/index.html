<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mia spesa</title>
<meta name="description" content="Lista della spesa a corsie, budget del mese ed equilibrio del carrello.">
<meta name="theme-color" content="#F3F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101222" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}

/* Una sola schermata: in alto budget e totale, poi le corsie colorate come card, in basso il grande tasto Aggiungi. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --ink:#16182B; --muted:#646985; --line:#E2E4F0; --soft:#ECEEF7;
  --hero:#23205A; --hero-ink:#FFFFFF; --hero-muted:#B9B6EA; --accent:#5B4BFF; --accent-ink:#FFFFFF;
  --good:#1FA35B; --warn:#E08A00; --bad:#E5484D;
  /* colori delle corsie */
  --fv:#22A45D; --pc:#E9A23B; --cp:#E5484D; --lu:#3B8FF0; --di:#C8693A; --su:#14B3C9;
  --be:#7C5CFF; --do:#E8559A; --ca:#5E7896; --al:#8A8FA8;
  /* gruppi alimentari */
  --g-v:#22A45D; --g-f:#F7882F; --g-ci:#C99A22; --g-cr:#E8CF8E; --g-p:#8C63E0; --g-red:#C5352E;
  --g-la:#7DB7F2; --g-gr:#7E9A27; --g-do:#E8559A;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101222; --surface:#1A1D33; --ink:#EEF0FF; --muted:#9EA3C4; --line:#2A2E4A; --soft:#222640;
  --hero:#2B2770; --hero-muted:#BDB9F2; --accent:#8C80FF; --accent-ink:#101222; --g-cr:#A8945C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101222; --surface:#1A1D33; --ink:#EEF0FF; --muted:#9EA3C4; --line:#2A2E4A; --soft:#222640;
  --hero:#2B2770; --hero-muted:#BDB9F2; --accent:#8C80FF; --accent-ink:#101222; --g-cr:#A8945C;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.press{transition:transform .12s ease}
.press:active{transform:scale(.96)}

/* hero: totale + budget */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:18px 20px 18px;display:grid;gap:12px;border:0;width:100%;text-align:left;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--fv) 0 25%,var(--pc) 0 45%,var(--cp) 0 60%,var(--lu) 0 78%,var(--do) 0 100%);opacity:.22}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.hero .lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.hero .tot{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;margin-top:6px}
.hero .edit{font-size:13px;font-weight:600;color:var(--hero-muted);background:rgb(255 255 255 / .1);padding:6px 10px;border-radius:99px;white-space:nowrap}
.mbar{height:14px;border-radius:99px;background:rgb(255 255 255 / .14);display:flex;overflow:hidden;position:relative;z-index:1}
.mbar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mbar .spent{background:#fff}
.mbar .plan{background:#8C80FF}
.mbar.over .plan{background:var(--bad)}
.hero .note{font-size:15px;color:var(--hero-muted);position:relative;z-index:1}
.hero .note b{color:#fff}
.hero .note .over{color:#FFB4B6}

/* equilibrio */
.bal{margin-top:12px;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.bal svg{flex:none}
.bal .t{flex:1;min-width:0}
.bal .t b{font-family:var(--font-display);font-size:18px;display:block}
.bal .t > span{font-size:14.5px;color:var(--muted);display:block}
.bal .go{font-size:22px;color:var(--muted)}
.score{font-family:var(--font-display);font-weight:800}

/* corsie */
.aisles{display:grid;gap:14px;margin-top:16px}
.aisle{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 0 rgb(0 0 0 / .02)}
.ahead{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;background:var(--c);color:#fff;border:0;width:100%;text-align:left}
.ahead .em{width:42px;height:42px;border-radius:14px;background:rgb(255 255 255 / .22);display:grid;place-items:center;font-size:24px;flex:none}
.ahead h2{font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead .cnt{font-weight:700;font-size:15px;background:rgb(255 255 255 / .22);padding:4px 10px;border-radius:99px;white-space:nowrap}
.aprog{height:5px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.aprog i{display:block;height:100%;background:var(--c);transition:width .4s ease}
.aisle.complete .ahead{background:color-mix(in srgb,var(--c) 70%,#000 0%)}
.aisle.complete.closed .rows{display:none}
.rows{list-style:none;margin:0;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 10px;min-height:64px;transition:opacity .3s ease}
.row + .row{border-top:1px solid var(--line)}
.chk{width:48px;height:48px;border-radius:50%;border:3px solid color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;flex:none;display:grid;place-items:center;padding:0;transition:background .2s ease,border-color .2s ease,transform .15s ease}
.chk svg{width:24px;height:24px;stroke:#fff;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .25s ease .05s}
.row.done .chk{background:var(--c);border-color:var(--c)}
.row.done .chk svg{stroke-dashoffset:0}
.row.pop .chk{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.row .nm{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:6px 0}
.row .nm b{display:block;font-size:17.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--muted);font-size:14px}
.row.done{opacity:.5}
.row.done .nm b{text-decoration:line-through;text-decoration-thickness:2px}
.qbadge{font-weight:800;font-size:15px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:10px;padding:5px 9px;flex:none}
.row .pr{font-weight:700;font-size:16px;min-width:64px;text-align:right;flex:none}

/* vuoto */
.empty{margin-top:18px;background:var(--surface);border-radius:var(--r);padding:26px 20px;text-align:center;border:1px solid var(--line);display:grid;gap:14px;justify-items:center}
.empty .dots{display:flex;gap:8px;font-size:30px}
.empty h2{font-size:24px}
.empty p{margin:0;color:var(--muted);font-size:16px;max-width:30ch}

/* barra in basso */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.big{border:0;border-radius:18px;min-height:60px;padding:0 20px;font-size:18px;font-weight:800;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:10px}
.big.add{flex:1;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.big.add span{font-size:28px;line-height:1;font-weight:600}
.big.fin{background:var(--good);color:#fff}
.big.sec{background:var(--soft);color:var(--ink)}

/* fogli */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(10 10 30 / .45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.6}}
.sheet .hd{padding:10px 18px 12px;display:grid;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet .hd .tt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:24px;font-weight:800}
.sheet .bd{overflow:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:22px;display:grid;place-items:center;flex:none}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 14px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;padding:14px 0;font-size:17px;outline:none;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:18px;background:var(--c);color:#fff;padding:14px;min-height:92px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative}
.tile .em{font-size:30px;line-height:1}
.tile b{font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.15}
.tile .n{position:absolute;top:10px;right:10px;background:#fff;color:var(--c);font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.back{border:0;background:var(--soft);border-radius:99px;padding:10px 16px;font-weight:700;font-size:15px;justify-self:start}
.ahd{display:flex;align-items:center;gap:12px}
.ahd .em{width:48px;height:48px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:26px}
.ahd h3{font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));background:var(--surface);border-radius:16px;min-height:52px;padding:8px 14px;font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:left}
.chip small{font-weight:500;color:var(--muted);font-size:13px}
.chip.in{background:var(--c);border-color:var(--c);color:#fff}
.chip.in small{color:rgb(255 255 255 / .85)}
.chip .q{background:#fff;color:var(--c);border-radius:10px;font-weight:800;font-size:13px;padding:2px 7px}
.chip.flash{animation:pop .3s ease}
.sec-lbl{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.res{display:grid;gap:8px}
.resb{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:16px;padding:12px 14px;min-height:60px;text-align:left;border-left:6px solid var(--c)}
.resb b{font-size:17px;flex:1}
.resb small{color:var(--muted);font-size:13.5px;text-align:right}

/* foglio prodotto */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--surface);border-radius:20px;padding:12px}
.stepper button{width:64px;height:64px;border-radius:50%;border:0;background:var(--soft);font-size:32px;font-weight:600;display:grid;place-items:center}
.stepper output{font-family:var(--font-display);font-size:40px;font-weight:800;min-width:60px;text-align:center}
.field{display:grid;gap:8px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-size:18px;width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.aisle-pick{display:flex;flex-wrap:wrap;gap:8px}
.aisle-pick button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:15px;font-weight:600}
.aisle-pick button.on{background:var(--c);border-color:var(--c);color:#fff}
.btns{display:flex;gap:10px}
.btns .big{flex:1}
.big.del{background:transparent;color:var(--bad);border:2px solid color-mix(in srgb,var(--bad) 40%,transparent);flex:0 0 auto}
.hist{display:grid;gap:8px}
.hist div{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.hist button{border:0;background:transparent;color:var(--muted);font-size:22px;width:40px;height:40px}

/* equilibrio dettaglio */
.bscore{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:16px}
.bscore .score{font-size:56px;line-height:1}
.bscore p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.pill{display:inline-block;font-size:14px;font-weight:800;padding:3px 10px;border-radius:99px}
.bars{background:var(--surface);border-radius:20px;padding:6px 16px}
.bars .r{padding:12px 0;display:grid;gap:8px}
.bars .r + .r{border-top:1px solid var(--line)}
.bars .r .h{display:flex;justify-content:space-between;font-size:16px}
.bars .r .h span{color:var(--muted);font-size:14px}
.track{height:14px;border-radius:99px;background:var(--soft);display:flex;overflow:hidden;position:relative}
.track i{display:block;height:100%}
.track .ideal{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.tip{background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:8px;border-left:6px solid var(--c)}
.tip h3{font-family:var(--font-body);font-size:17.5px;font-weight:800}
.tip p{margin:0;font-size:15.5px}
.tip a{font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none}
.tip .addb{justify-self:start;border:0;background:var(--c);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px}
.fine{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:16px;font-size:16px;font-weight:700;display:flex;gap:16px;align-items:center;white-space:nowrap;animation:up .25s ease}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;padding:4px}
.celebrate{margin-top:14px;border-radius:var(--r);padding:16px 18px;background:var(--good);color:#fff;display:flex;align-items:center;gap:14px}
.celebrate b{font-family:var(--font-display);font-size:19px;display:block}
.celebrate span{font-size:14.5px;opacity:.9}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <button class="hero press" id="hero" aria-label="Budget del mese, tocca per modificarlo"></button>
  <button class="bal press" id="bal" hidden></button>
  <div id="celebrate"></div>
  <div id="main"></div>
</div>

<div class="dock"><div class="in">
  <button class="big add press" id="addBtn"><span>+</span> Aggiungi</button>
  <button class="big fin press" id="finBtn" hidden>Fine spesa</button>
</div></div>

<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
/* ---------- Corsie e gruppi ---------- */
const AISLES=[
 ["fv","Frutta e verdura","🥦"],["pc","Pane e pasta","🍞"],["cp","Carne e pesce","🐟"],["lu","Latte, uova e formaggi","🧀"],
 ["di","Dispensa","🥫"],["su","Surgelati","🧊"],["be","Bevande","🥤"],["do","Dolci e snack","🍫"],["ca","Casa e igiene","🧻"],["al","Altro","🛒"]];
const AISLE=Object.fromEntries(AISLES.map(a=>[a[0],a]));
const GROUPS={V:1,F:1,CI:1,CR:1,LG:1,PE:1,CB:1,RO:1,PR:1,LA:1,GR:1,DO:1,BE:1,NA:1};
const GCOL={V:"--g-v",F:"--g-f",CI:"--g-ci",CR:"--g-cr",LG:"--g-p",PE:"--g-p",CB:"--g-p",RO:"--g-red",PR:"--g-red",LA:"--g-la",GR:"--g-gr",DO:"--g-do"};
const gcol=g=>`var(${GCOL[g]||"--muted"})`;

/* ---------- Catalogo: nome | corsia | gruppo | prezzo € | confezione | porzioni ---------- */
const RAW=`Mele|fv|F|2.2|1 kg|6
Banane|fv|F|1.9|1 kg|6
Arance|fv|F|1.8|1 kg|5
Pere|fv|F|2.5|1 kg|6
Kiwi|fv|F|3|1 kg|8
Clementine|fv|F|2.2|1 kg|7
Uva|fv|F|3.5|1 kg|6
Fragole|fv|F|3.5|250 g|2
Frutti di bosco|fv|F|3|125 g|1
Limoni|fv|F|2.5|1 kg|0
Pomodori|fv|V|2.8|1 kg|5
Pomodorini|fv|V|2.5|500 g|2
Insalata|fv|V|1.5|1 cespo|3
Insalata in busta|fv|V|1.6|125 g|2
Rucola|fv|V|1.5|125 g|2
Zucchine|fv|V|2.4|1 kg|5
Carote|fv|V|1.3|1 kg|6
Spinaci|fv|V|2.5|500 g|2
Broccoli|fv|V|2.8|1 kg|4
Cavolfiore|fv|V|2.2|1 pz|4
Melanzane|fv|V|2.4|1 kg|4
Peperoni|fv|V|3|1 kg|5
Finocchi|fv|V|2.5|1 kg|4
Zucca|fv|V|1.8|1 kg|4
Cetrioli|fv|V|2|1 kg|4
Funghi|fv|V|2.5|250 g|2
Cipolle|fv|V|1.5|1 kg|3
Aglio|fv|V|0.8|1 testa|0
Basilico|fv|V|1.2|1 vaso|0
Patate|fv|CR|1.5|1 kg|5
Avocado|fv|GR|1.5|1 pz|2
Pane|pc|CR|1.8|500 g|8
Pane integrale|pc|CI|2.4|500 g|8
Pasta|pc|CR|1.2|500 g|6
Pasta integrale|pc|CI|1.6|500 g|6
Riso|pc|CR|2.2|1 kg|12
Riso integrale|pc|CI|2.8|1 kg|12
Farro|pc|CI|2.5|500 g|6
Orzo|pc|CI|2|500 g|6
Fiocchi d'avena|pc|CI|2|500 g|12
Gallette di riso|pc|CR|1.5|130 g|4
Cracker|pc|CR|1.5|500 g|6
Fette biscottate|pc|CR|1.8|1 pacco|10
Cereali per colazione|pc|CR|3|375 g|10
Piadine|pc|CR|1.9|4 pz|4
Farina|pc|CR|1|1 kg|0

/* ---------- Helpers ---------- */
const eur=n=>n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const eur0=n=>Math.round(n).toLocaleString("it-IT")+" €";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cvar=rep=>`--c:var(--${AISLE[rep]?rep:"al"})`;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const total=its=>its.reduce((s,i)=>s+i.price*i.qty,0);
const spentMonth=()=>{const m=today().slice(0,7);return state.history.filter(h=>h.d.slice(0,7)===m).reduce((s,h)=>s+h.t,0)};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
function lookup(name){const k=norm(name),c=BYNAME[k],m=state.my[k];if(!c&&!m)return null;return Object.assign({},c||{},m||{})}
const stem=w=>w.length>3?w.replace(/[aeiou]$/,""):w;
function search(q){q=norm(q);if(!q)return[];const qs=stem(q);
  const sc=c=>{const n=norm(c.name),ws=n.split(/[\s']/);if(n.startsWith(q))return 0;if(ws.some(w=>w.startsWith(q)))return 1;if(ws.some(w=>w.startsWith(qs)))return 2;if(n.includes(q))return 3;return 9};
  const pool={};for(const c of CATALOG)pool[norm(c.name)]=c;for(const k in state.my)pool[k]=lookup(k);
  return Object.values(pool).map(c=>[sc(c),c]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.length-b[1].name.length).slice(0,8).map(x=>x[1])}
function aisleProducts(rep){
  const pool={};for(const c of CATALOG)if(c.rep===rep)pool[norm(c.name)]=c;
  for(const k in state.my)if(state.my[k].rep===rep)pool[k]=lookup(k);else delete pool[k];
  const pop=POPULAR[rep]||[],f=state.freq;
  return Object.values(pool).sort((a,b)=>(f[b.name]||0)-(f[a.name]||0)||((pop.indexOf(a.name)+1||99)-(pop.indexOf(b.name)+1||99))||a.name.localeCompare(b.name,"it"));
}
const inList=name=>state.items.find(i=>norm(i.name)===norm(name));

/* ---------- Equilibrio ---------- */
function analyze(items){
  const s={};for(const k in GROUPS)s[k]=0;
  for(const i of items)s[i.grp]=(s[i.grp]||0)+(i.porz||0)*i.qty;
  const fv=s.V+s.F,cer=s.CI+s.CR,pro=s.LG+s.PE+s.CB+s.RO+s.PR,plate=fv+cer+pro,extra=s.LA+s.GR+s.DO,all=plate+extra;
  const r={s,fv,cer,pro,plate,extra,all,score:null,tips:[]};
  if(plate<6)return r;
  const p=x=>100*x/plate;
  let sc=100-(Math.abs(p(fv)-50)+Math.abs(p(cer)-25)+Math.abs(p(pro)-25))*0.7;
  if(s.V<s.F)sc-=5;
  if(cer>0&&s.CR>s.CI)sc-=8;
  const red=pro?(s.RO+s.PR)/pro:0; if(red>0.4)sc-=10; if(s.PR>0)sc-=4;
  const sweet=all?s.DO/all:0; if(sweet>0.25)sc-=20;else if(sweet>0.15)sc-=10;
  r.score=Math.max(0,Math.min(100,Math.round(sc)));
  const T=r.tips;
  if(p(fv)<40)T.push({g:"V",t:"Più frutta e verdura",x:`Nel carrello sono il ${Math.round(p(fv))}% del piatto, l'obiettivo è metà. L'OMS indica almeno 400 g al giorno di frutta e verdura, circa 5 porzioni, patate escluse.`,src:["oms","harv"]});
  if(s.PR>0||red>0.4)T.push({g:"PR",t:"Meno salumi e carne rossa",x:"La IARC classifica le carni lavorate come cancerogene (gruppo 1) e la carne rossa come probabilmente cancerogena (2A). Il WCRF consiglia al massimo 350–500 g di carne rossa cotta a settimana e pochissimi salumi.",src:["iarc","wcrf"]});
  if(sweet>0.15)T.push({g:"DO",t:"Dolci, snack e bibite sono tanti",x:`Valgono il ${Math.round(sweet*100)}% delle porzioni. L'OMS raccomanda di tenere gli zuccheri aggiunti sotto il 10% delle calorie, meglio sotto il 5%.`,src:["omsZ"]});
  if(s.LG===0)T.push({g:"LG",t:"Aggiungi un legume",x:"Ceci, lenticchie o fagioli danno proteine, fibre e costano poco. Le linee guida CREA consigliano di consumarli più volte a settimana, anche al posto della carne.",src:["crea"],add:"Lenticchie secche"});
  if(cer>0&&s.CR>s.CI)T.push({g:"CI",t:"Passa ai cereali integrali",x:"Una meta-analisi su oltre 45 studi lega 90 g al giorno di cereali integrali a un rischio di mortalità più basso del 17%. Il piatto di Harvard ne prevede un quarto.",src:["aune","harv"],add:"Pasta integrale"});
  if(s.PE===0)T.push({g:"PE",t:"Manca il pesce",x:"Le linee guida CREA suggeriscono il pesce 2–3 volte a settimana, anche surgelato o in scatola come sgombro e tonno.",src:["crea"],add:"Sgombro in scatola"});
  if(s.V<s.F&&p(fv)>=40)T.push({g:"V",t:"Più verdura che frutta",x:"Nel piatto di Harvard la verdura occupa più spazio della frutta: varia colori e tipi.",src:["harv"]});
  if(s.GR===0)T.push({g:"GR",t:"Una manciata di frutta secca",x:"Nello studio PREDIMED la dieta mediterranea con frutta secca o olio extravergine ha ridotto di circa il 30% gli eventi cardiovascolari.",src:["pred"],add:"Noci"});
  if(!T.length)T.push({g:"V",t:"Carrello ben bilanciato",x:"Metà frutta e verdura, un quarto cereali integrali, un quarto proteine sane: è lo schema del piatto di Harvard.",src:["harv"]});
  r.tips=T.slice(0,3);
  return r;
}

function renderHero(){
  const b=state.budget||0,spent=spentMonth(),plan=total(state.items),left=b-spent-plan,over=left<0;
  const w=x=>b?Math.max(0,Math.min(100,100*x/b)):0;
  const n=state.items.length,d=state.items.filter(i=>i.done).length;
  document.getElementById("hero").innerHTML=`
   <div class="top"><div><div class="lbl">${n?`La tua lista · ${d} di ${n} presi`:"La tua lista"}</div><div class="tot num">${eur(plan)}</div></div><span class="edit">Budget ${eur0(b)}</span></div>
   <div class="mbar${over?" over":""}"><i class="spent" style="width:${w(spent)}%"></i><i class="plan" style="width:${Math.min(w(plan),100-w(spent))}%"></i></div>
   <div class="note">${over?`<span class="over">Con questa lista <b>sfori di ${eur0(-left)}</b></span>`:`A ${MESI[new Date().getMonth()]} hai speso <b>${eur0(spent)}</b>. ${plan?"Dopo questa spesa ti restano":"Ti restano"} <b>${eur0(left)}</b>`}</div>`;
}
function donut(A,size=56){
  const parts=[["V",A.s.V],["F",A.s.F],["CI",A.s.CI],["CR",A.s.CR],["LG",A.s.LG+A.s.PE+A.s.CB],["RO",A.s.RO+A.s.PR]];
  const tot=parts.reduce((s,p)=>s+p[1],0)||1;let off=0;const R=15.915;
  const segs=parts.filter(p=>p[1]).map(([g,v])=>{const len=100*v/tot,s=`<circle r="${R}" cx="21" cy="21" fill="none" stroke="${gcol(g)}" stroke-width="7" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${25-off}"/>`;off+=len;return s}).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 42 42" aria-hidden="true"><circle r="${R}" cx="21" cy="21" fill="none" stroke="var(--soft)" stroke-width="7"/>${segs}</svg>`;
}
const lvl=n=>n>=80?"good":n>=60?"warn":"bad";
function renderBal(){
  const A=analyze(state.items),el=document.getElementById("bal");
  if(A.score===null){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`${donut(A)}<div class="t"><b>Equilibrio <span class="score" style="color:var(--${lvl(A.score)})">${A.score}</span>/100</b><span>${esc(A.tips[0].t)}</span></div><span class="go" aria-hidden="true">›</span>`;
}
function renderMain(){
  const M=document.getElementById("main");
  if(!state.items.length){
    const top=Object.entries(state.freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]);
    M.innerHTML=`<div class="empty"><div class="dots" aria-hidden="true">🥦🍞🧀🐟</div><h2>La lista è vuota</h2>
      <p>Tocca <b>Aggiungi</b>, scegli la corsia e tocca i prodotti. Li ritrovi divisi per corsia, nell'ordine del supermercato.</p>
      ${top.length?`<div class="sec-lbl">I tuoi soliti</div><div class="chips" style="justify-content:center">${top.map(n=>{const c=lookup(n);return`<button class="chip press" style="${cvar(c?c.rep:"al")}" data-add="${esc(n)}">+ ${esc(n)}</button>`}).join("")}</div>`:""}</div>`;
    return;
  }
  let h='<div class="aisles">';
  for(const[k,label,em]of AISLES){
    const its=state.items.filter(i=>i.rep===k);if(!its.length)continue;
    its.sort((a,b)=>a.done-b.done);
    const d=its.filter(i=>i.done).length,complete=d===its.length;
    h+=`<section class="aisle${complete?" complete":""}${complete&&!closed.has("open-"+k)?" closed":""}" style="${cvar(k)}">
      <button class="ahead" data-aisle="${k}" aria-expanded="${!(complete&&!closed.has("open-"+k))}"><span class="em" aria-hidden="true">${em}</span><h2>${label}</h2><span class="cnt">${complete?"✓ Fatto":`${d}/${its.length}`}</span></button>
      <div class="aprog"><i style="width:${100*d/its.length}%"></i></div><ul class="rows">`;
    for(const i of its)h+=`<li class="row${i.done?" done":""}" data-id="${i.id}">
      <button class="chk" data-act="toggle" aria-pressed="${i.done}" aria-label="${i.done?"Rimetti":"Preso"}: ${esc(i.name)}"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="nm" data-act="edit"><b>${esc(i.name)}</b><small>${esc(i.unit||"")}${i.unit?" · ":""}${eur(i.price)}</small></button>
      ${i.qty>1?`<span class="qbadge num">×${i.qty}</span>`:""}<span class="pr num">${eur(i.price*i.qty)}</span></li>`;
    h+=`</ul></section>`;
  }
  M.innerHTML=h+"</div>";
}

/* ---------- Azioni ---------- */
function toast(t,undo){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast">${esc(t)}${undo?`<button id="undoBtn">Annulla</button>`:""}</div>`;
  if(undo)document.getElementById("undoBtn").onclick=()=>{undo();r.innerHTML="";commit()};
  clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",undo?5000:1800)}
function add(name){
  name=name.trim();if(!name)return null;
  const ex=inList(name);
  if(ex){ex.qty++;ex.done=false;commit();return ex}
  const c=lookup(name);
  const it=c?{...c,id:uid(),qty:1,done:false}:{id:uid(),name:name.charAt(0).toUpperCase()+name.slice(1),rep:"al",grp:"NA",price:0,unit:"",porz:1,qty:1,done:false};
  state.items.push(it);commit();buzz();return it;
}
function removeItem(it){const ix=state.items.indexOf(it);if(ix<0)return;state.items.splice(ix,1);commit();toast(`${it.name} tolto`,()=>state.items.splice(Math.min(ix,state.items.length),0,it))}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a&&!a.closest(".sheet")){add(a.dataset.add);toast(`${a.dataset.add} aggiunto`);return}
  const hd=e.target.closest(".ahead");if(hd){const k=hd.dataset.aisle,sec=hd.closest(".aisle");if(sec.classList.contains("complete")){closed.has("open-"+k)?closed.delete("open-"+k):closed.add("open-"+k);renderMain()}return}
  const b=e.target.closest("[data-act]");if(!b||b.closest(".sheet"))return;
  const row=b.closest(".row"),it=row&&state.items.find(i=>i.id===row.dataset.id);if(!it)return;
  if(b.dataset.act==="toggle"){
    it.done=!it.done;buzz();
    if(it.done){row.classList.add("done","pop");setTimeout(commit,380)}else commit();
  }else if(b.dataset.act==="edit")itemSheet(it);
});

      const r=search(q),exact=r.some(c=>norm(c.name)===norm(q));
      bd.innerHTML=`<div class="res">${r.map(c=>{const x=inList(c.name);return`<button class="resb press" style="${cvar(c.rep)}" data-pick="${esc(c.name)}"><b>${esc(c.name)}</b>${x?`<span class="qbadge" style="${cvar(c.rep)}">×${x.qty}</span>`:""}<small>${AISLE[c.rep][1]}<br>${eur(c.price)}</small></button>`}).join("")}
        ${exact?"":`<button class="resb press" style="${cvar("al")}" data-pick="${esc(q)}"><b>Aggiungi «${esc(q)}»</b><small>nuovo prodotto</small></button>`}</div>`;
    }else if(rep){
      const[k,label,em]=AISLE[rep];
      bd.innerHTML=`<button class="back press" data-back>‹ Tutte le corsie</button><div class="ahd" style="${cvar(k)}"><span class="em" aria-hidden="true">${em}</span><h3>${label}</h3></div>
        <div class="chips">${aisleProducts(k).map(chip).join("")||`<p style="color:var(--muted);margin:0">Qui finiscono i prodotti nuovi che aggiungi scrivendoli sopra.</p>`}</div>`;
    }else{
      const top=Object.entries(state.freq).sort((a,b)=>b[1]-a[1]).map(e=>lookup(e[0])).filter(Boolean).slice(0,8);
      bd.innerHTML=`${top.length?`<div class="sec-lbl">I tuoi soliti</div><div class="chips">${top.map(chip).join("")}</div>`:""}
        <div class="sec-lbl">Scegli la corsia</div><div class="tiles">${AISLES.filter(a=>a[0]!=="al").map(([k,l,em])=>`<button class="tile press" style="${cvar(k)}" data-rep="${k}"><span class="em" aria-hidden="true">${em}</span><b>${l}</b>${count(k)?`<span class="n">${count(k)}</span>`:""}</button>`).join("")}</div>`;
    }
    bd.onclick=e=>{
      const p=e.target.closest("[data-pick]");if(p){const it=add(p.dataset.pick);if(it&&!lookup(it.name)){closeSheet();itemSheet(it,true);return}
        const el=bd.querySelector(`[data-pick="${CSS.escape(p.dataset.pick)}"]`);el&&el.classList.add("flash");
        if(q){q="";const inp=document.getElementById("q");inp.value="";openSheet.refresh()}return}
      const r=e.target.closest("[data-rep]");if(r){rep=r.dataset.rep;openSheet.refresh();bd.scrollTop=0;return}
      if(e.target.closest("[data-back]")){rep=null;openSheet.refresh()}
    };
  },{head:`<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca o scrivi un prodotto" autocomplete="off" autocorrect="off" enterkeyhint="done" aria-label="Cerca un prodotto"></label>`,
   ready:()=>{const inp=document.getElementById("q");inp.addEventListener("input",()=>{q=inp.value.trim();openSheet.refresh()});
     inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&q){e.preventDefault();const r=search(q);const it=add(r[0]&&norm(r[0].name).startsWith(norm(q))?r[0].name:q);inp.value="";q="";if(it&&!lookup(it.name)){closeSheet();itemSheet(it,true)}else openSheet.refresh()}})}});
}

/* Prodotto: quantità grande, prezzo, corsia */
function itemSheet(it,isNew){
  let qty=it.qty,rep=it.rep;
  sheet(isNew?"Nuovo prodotto":it.name,bd=>{
    if(bd.dataset.built)return;bd.dataset.built=1;
    bd.innerHTML=`${isNew?`<div class="field"><label for="iName">Nome</label><input id="iName" value="${esc(it.name)}"></div>`:""}
      <div class="stepper"><button class="press" id="qm" aria-label="Meno">−</button><output id="qv" class="num">${qty}</output><button class="press" id="qp" aria-label="Più">+</button></div>
      <div class="field"><label for="iPrice">Prezzo al pezzo (€). Se lo cambi, me lo ricordo</label><input id="iPrice" inputmode="decimal" value="${it.price.toFixed(2).replace(".",",")}"></div>
      <div class="field"><label>Corsia</label><div class="aisle-pick" id="ap">${AISLES.map(([k,l,em])=>`<button style="${cvar(k)}" data-k="${k}" class="${k===rep?"on":""}">${em} ${l}</button>`).join("")}</div></div>
      <div class="btns"><button class="big del press" id="iDel">Togli</button><button class="big add press" id="iSave">Salva</button></div>`;
    const qv=document.getElementById("qv");
    document.getElementById("qm").onclick=()=>{qty=Math.max(1,qty-1);qv.textContent=qty};
    document.getElementById("qp").onclick=()=>{qty++;qv.textContent=qty};
    document.getElementById("ap").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;rep=b.dataset.k;document.querySelectorAll("#ap button").forEach(x=>x.classList.toggle("on",x===b))};
    document.getElementById("iDel").onclick=()=>{closeSheet();removeItem(it)};
    document.getElementById("iSave").onclick=()=>{
      if(isNew){const n=document.getElementById("iName").value.trim();if(n)it.name=n}
      it.qty=qty;it.price=Math.max(0,parseNum(document.getElementById("iPrice").value));it.rep=rep;
      state.my[norm(it.name)]={name:it.name,rep:it.rep,grp:it.grp,price:it.price,unit:it.unit||"",porz:it.porz};
      closeSheet();commit();
    };
  },{ready:()=>{if(isNew){const p=document.getElementById("iPrice");p.focus();p.select()}}});
}

/* Fine spesa */
function finishSheet(){
  const done=state.items.filter(i=>i.done),rest=state.items.length-done.length;
  sheet("Com'è andata?",bd=>{
    if(bd.dataset.built)return;bd.dataset.built=1;
    bd.innerHTML=`<p style="margin:0;font-size:16px;color:var(--muted)">Registro i ${done.length} prodotti presi.${rest?` Gli altri ${rest} restano in lista per la prossima volta.`:""}</p>
      <div class="field"><label for="fTot">Totale dello scontrino (€)</label><input id="fTot" inputmode="decimal" value="${total(done).toFixed(2).replace(".",",")}"></div>
      <button class="big fin press" id="fOk">Registra la spesa</button>`;
    document.getElementById("fOk").onclick=()=>{
      const t=Math.max(0,parseNum(document.getElementById("fTot").value));
      state.history.push({d:today(),t:Math.round(t*100)/100,n:done.length});
      for(const i of done)state.freq[i.name]=(state.freq[i.name]||0)+1;
      state.items=state.items.filter(i=>!i.done);closeSheet();commit();toast(`Registrati ${eur(t)} 👍`);
    };
  },{ready:()=>{const f=document.getElementById("fTot");f.focus();f.select()}});
}

/* Budget */
function budgetSheet(){
  sheet("Budget del mese",bd=>{
    const byMonth={};for(const h of state.history){const k=h.d.slice(0,7);byMonth[k]=(byMonth[k]||0)+h.t}
    const months=Object.entries(byMonth).sort().reverse().slice(0,6);
    const last=state.history.map((h,ix)=>({h,ix})).reverse().slice(0,8);
    bd.innerHTML=`<div class="field"><label for="bIn">Quanto vuoi spendere al mese (€)</label><input id="bIn" inputmode="numeric" value="${state.budget}"></div>
      <button class="big add press" id="bOk">Salva budget</button>
      ${months.length?`<div class="sec-lbl">Mesi</div><div class="hist">${months.map(([k,v])=>{const[y,m]=k.split("-");return`<div><span>${MESI[+m-1]} ${y}</span><b class="num" style="color:${v>state.budget?"var(--bad)":"inherit"}">${eur(v)}</b></div>`}).join("")}</div>`:""}
      ${last.length?`<div class="sec-lbl">Ultime spese</div><div class="hist">${last.map(({h,ix})=>`<div><span>${new Date(h.d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"})} · ${h.n} prodotti</span><span><b class="num">${eur(h.t)}</b><button data-del="${ix}" aria-label="Elimina questa spesa">×</button></span></div>`).join("")}</div>`
        :`<p class="fine" style="font-size:15px;margin:0">Quando tocchi «Fine spesa» e registri lo scontrino, il totale entra qui e nel budget del mese.</p>`}`;
    document.getElementById("bOk").onclick=()=>{state.budget=Math.max(0,Math.round(parseNum(document.getElementById("bIn").value)));closeSheet();commit();toast("Budget salvato")};
    bd.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.history.splice(+b.dataset.del,1);commit()});
  });
}

/* Equilibrio */
const TIPCOL={V:"--g-v",PR:"--g-red",DO:"--g-do",LG:"--g-p",CI:"--g-ci",PE:"--lu",GR:"--g-gr"};
function balanceSheet(){
  sheet("Equilibrio del carrello",bd=>{
    const A=analyze(state.items);if(A.score===null){closeSheet();return}
    const L=lvl(A.score),lab=A.score>=80?"Ben bilanciato":A.score>=60?"Quasi bilanciato":"Sbilanciato";
    const rows=[["Frutta e verdura",50,["V","F"]],["Cereali",25,["CI","CR"]],["Proteine",25,["LG","PE","CB","RO","PR"]]];
    const sub={V:"verdura",F:"frutta",CI:"integrali",CR:"raffinati",LG:"legumi",PE:"pesce",CB:"pollo/uova",RO:"carne rossa",PR:"salumi"};
    bd.innerHTML=`<div class="bscore"><span class="score num" style="color:var(--${L})">${A.score}</span><div><span class="pill" style="background:color-mix(in srgb,var(--${L}) 18%,transparent);color:var(--${L})">${lab}</span><p>Quanto il carrello si avvicina al piatto sano: metà frutta e verdura, un quarto cereali, un quarto proteine.</p></div></div>
      <div class="bars">${rows.map(([n,ideal,gs])=>{const v=gs.reduce((s,g)=>s+A.s[g],0),p=A.plate?Math.round(100*v/A.plate):0;
        const parts=gs.filter(g=>A.s[g]).map(g=>`${sub[g]} ${Math.round(100*A.s[g]/A.plate)}%`).join(" · ");
        return`<div class="r"><div class="h"><b>${n} ${p}%</b><span>ideale ${ideal}%</span></div><div class="track">${gs.map(g=>`<i style="width:${A.plate?100*A.s[g]/A.plate:0}%;background:${gcol(g)}"></i>`).join("")}<span class="ideal" style="left:calc(${ideal}% - 1.5px)"></span></div>${parts?`<div class="fine">${parts}</div>`:""}</div>`}).join("")}</div>
      <div class="sec-lbl">Cosa cambiare</div>
      ${A.tips.map(t=>`<div class="tip" style="--c:var(${TIPCOL[t.g]||"--accent"})"><h3>${esc(t.t)}</h3><p>${esc(t.x)}</p>
        ${t.src.map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">Fonte: ${esc(SRC[k][0])} ↗</a>`).join("")}
        ${t.add&&!inList(t.add)?`<button class="addb press" data-tipadd="${esc(t.add)}">+ ${esc(t.add)}</button>`:""}</div>`).join("")}
      <p class="fine">Le porzioni sono stimate dalle confezioni tipiche. Il calcolo riguarda la spesa, non quello che mangi, ed è un'indicazione, non un consiglio medico.</p>`;
    bd.querySelectorAll("[data-tipadd]").forEach(b=>b.onclick=()=>{add(b.dataset.tipadd);toast(`${b.dataset.tipadd} aggiunto`)});
  });
}

render();
</script>
